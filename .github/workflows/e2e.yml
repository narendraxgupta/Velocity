name: e2e

# Spins up the full docker-compose stack, submits the sample matching
# engine, runs a 10s baseline benchmark, and asserts a leaderboard row
# with composite_score > 0 materialises. Slow (~10 min) so it lives in
# its own workflow and runs on pushes to main / nightly only.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # nightly UTC 06:00
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: docker-compose smoke
    runs-on: ubuntu-22.04
    # Building the C++ base image (Conan/Boost/Drogon) plus all C++ services
    # from a cold cache is heavy; 30 min was too tight once the base build is
    # done in-job.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build C++ base image + proto stubs
        run: |
          # Every C++ service Dockerfile does `FROM velocity/cpp-base:builder`,
          # a locally-built image that exists on no registry. Build it first,
          # then generate the Go proto stubs that the submission-engine build
          # COPYs (they are gitignored, so absent on a fresh checkout).
          # Without this, `compose ... --build` falls back to *pulling*
          # docker.io/velocity/cpp-base:builder and fails with "pull access
          # denied". `make build` runs exactly these prerequisites.
          make build-cpp-base
          make proto-ensure

      - name: Bring up the stack
        run: |
          # `apps` alone only starts our services; the data plane (redpanda,
          # redis, questdb, minio, registry) lives in the `default` profile and
          # the app containers depend_on those healthchecks. Bring up both.
          docker compose --profile default --profile apps up -d --build
          docker compose ps

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 5
          done
          echo "gateway never came up"
          docker compose logs --tail=200
          exit 1

      - name: Run smoke test
        run: ./scripts/e2e-smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=500 > compose.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
