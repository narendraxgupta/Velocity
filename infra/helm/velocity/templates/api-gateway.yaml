{{- if .Values.apiGateway.enabled -}}
{{- $name := "api-gateway" -}}
{{- $controlNs := printf "%s-control" .Release.Name -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $controlNs }}
  labels:
    {{- include "velocity.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      {{- include "velocity.selectorLabels" (list . $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "velocity.selectorLabels" (list . $name) | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-gateway
          image: {{ include "velocity.image" (dict "ctx" . "image" .Values.apiGateway.image) }}
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.apiGateway.port }} }
          env:
            # The C++ gateway aborts at boot if any of these required upstreams
            # is unset (services/api-gateway/src/main.cpp::load_config). Mirror
            # the validated Kustomize base (infra/kubernetes/base/deployments/
            # api-gateway.yaml). The gateway does NOT consume Kafka, so no
            # broker var is needed here; Redis is a bare host:port (no scheme).
            - { name: VELOCITY_HTTP_PORT,              value: "{{ .Values.apiGateway.port }}" }
            - { name: VELOCITY_REDIS_ADDR,             value: "{{ include "velocity.redisAddr" . }}" }
            - { name: VELOCITY_SUBMISSION_ENGINE_GRPC, value: "submission-engine.{{ $controlNs }}.svc.cluster.local:{{ .Values.submissionEngine.grpcPort }}" }
            - { name: VELOCITY_BOT_CONTROLLER_GRPC,    value: "bot-controller.{{ $controlNs }}.svc.cluster.local:{{ .Values.botController.grpcPort }}" }
            {{- if eq .Values.minio.mode "external" }}
            - { name: VELOCITY_MINIO_ENDPOINT,   value: "{{ required "minio.external.endpoint required when minio.mode=external" .Values.minio.external.endpoint }}" }
            - { name: VELOCITY_MINIO_ACCESS_KEY, value: "{{ .Values.minio.external.accessKey }}" }
            - { name: VELOCITY_MINIO_SECRET_KEY, value: "{{ .Values.minio.external.secretKey }}" }
            {{- else }}
            - { name: VELOCITY_MINIO_ENDPOINT,   value: "{{ .Release.Name }}-minio.{{ .Release.Name }}-data.svc.cluster.local:9000" }
            - { name: VELOCITY_MINIO_ACCESS_KEY, value: "velocity" }
            - { name: VELOCITY_MINIO_SECRET_KEY, value: "velocity-dev-secret" }
            {{- end }}
            # Optional proxy upstreams. Point at THIS release's control namespace;
            # the in-code default targets a literal "velocity-control" namespace
            # that doesn't exist under a Helm release.
            - { name: VELOCITY_CHAOS_URL,    value: "http://chaos-orchestrator.{{ $controlNs }}.svc.cluster.local:8090" }
            - { name: VELOCITY_RECORDER_URL, value: "http://pcap-recorder.{{ $controlNs }}.svc.cluster.local:8091" }
            - { name: VELOCITY_REPLAYER_URL, value: "http://pcap-replayer.{{ $controlNs }}.svc.cluster.local:8092" }
            - { name: VELOCITY_AUTH_REQUIRE, value: "{{ .Values.apiGateway.requireAuth }}" }
            {{- if .Values.apiGateway.jwtSecretBase64 }}
            - name: VELOCITY_JWT_HS256_SECRET_B64
              valueFrom:
                secretKeyRef:
                  name: {{ include "velocity.fullname" . }}-jwt
                  key: secret
            {{- end }}
          readinessProbe: { httpGet: { path: /readyz,  port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 30 }
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $controlNs }}
  labels:
    {{- include "velocity.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    {{- include "velocity.selectorLabels" (list . $name) | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.apiGateway.port }}, targetPort: http }
{{- if .Values.apiGateway.jwtSecretBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "velocity.fullname" . }}-jwt
  namespace: {{ $controlNs }}
type: Opaque
data:
  secret: {{ .Values.apiGateway.jwtSecretBase64 | b64enc | quote }}
{{- end }}
{{- end }}
