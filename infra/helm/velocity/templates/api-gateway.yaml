{{- if .Values.apiGateway.enabled -}}
{{- $name := "api-gateway" -}}
{{- $controlNs := printf "%s-control" .Release.Name -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $controlNs }}
  labels:
    {{- include "velocity.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      {{- include "velocity.selectorLabels" (list . $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "velocity.selectorLabels" (list . $name) | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-gateway
          image: {{ include "velocity.image" (dict "ctx" . "image" .Values.apiGateway.image) }}
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.apiGateway.port }} }
          env:
            - { name: REDIS_ADDR,    value: "{{ include "velocity.redisAddr" . }}" }
            - { name: KAFKA_BROKERS, value: "{{ include "velocity.kafkaBrokers" . }}" }
            - { name: VELOCITY_AUTH_REQUIRE, value: "{{ .Values.apiGateway.requireAuth }}" }
            {{- if .Values.apiGateway.jwtSecretBase64 }}
            - name: VELOCITY_JWT_HS256_SECRET_B64
              valueFrom:
                secretKeyRef:
                  name: {{ include "velocity.fullname" . }}-jwt
                  key: secret
            {{- end }}
          readinessProbe: { httpGet: { path: /readyz,  port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 30 }
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $controlNs }}
  labels:
    {{- include "velocity.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    {{- include "velocity.selectorLabels" (list . $name) | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.apiGateway.port }}, targetPort: http }
{{- if .Values.apiGateway.jwtSecretBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "velocity.fullname" . }}-jwt
  namespace: {{ $controlNs }}
type: Opaque
data:
  secret: {{ .Values.apiGateway.jwtSecretBase64 | b64enc | quote }}
{{- end }}
{{- end }}
