apiVersion: 1

providers:
  - name: velocity-dashboards
    orgId: 1
    folder: Velocity
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Must match the compose volume mount target for the dashboards dir
      # (docker-compose.yml mounts them at /var/lib/grafana/dashboards).
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
