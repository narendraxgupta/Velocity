# =============================================================================
# QuestDB server configuration — tuned for the Velocity benchmark workload.
#
# Workload profile:
#   * Write-heavy (millions of rows/sec via ILP TCP)
#   * Append-only — no updates, occasional deletes by time range
#   * Read queries are window-aggregated percentile_cont equivalents
#
# Reference: https://questdb.io/docs/reference/configuration/
# =============================================================================

# ---- HTTP / REST API --------------------------------------------------------
http.bind.to=0.0.0.0:9000
http.min.enabled=true
http.security.readonly=false
http.security.interrupt.on.closed.connection=true

# ---- Postgres wire protocol -------------------------------------------------
pg.enabled=true
pg.net.bind.to=0.0.0.0:8812
pg.user=velocity
pg.password=velocity-dev

# ---- ILP (InfluxDB Line Protocol) — the high-throughput write path ---------
# QuestDB 7+ removed ILP-over-UDP entirely; we use TCP only.
line.tcp.enabled=true
line.tcp.net.bind.to=0.0.0.0:9009
line.tcp.connection.pool.capacity=1024
line.tcp.io.worker.count=4
line.tcp.writer.worker.count=4
line.tcp.maintenance.job.interval=30000
line.tcp.commit.interval.default=1000
line.tcp.commit.timeout=1000

# ---- Storage tuning ---------------------------------------------------------
cairo.commit.lag=1000
cairo.max.uncommitted.rows=500000
cairo.o3.column.memory.size=8m
cairo.o3.max.lag=600000

# ---- Telemetry off ---------------------------------------------------------
telemetry.enabled=false
telemetry.hide.tables=true

# ---- Logging ---------------------------------------------------------------
log.level.default=INFO
