# =============================================================================
# Prometheus — scrape configuration for the local dev stack.
#
# We use static targets here. In Kubernetes we replace this with the
# ServiceMonitor CRD via the Prometheus Operator.
# =============================================================================

global:
  scrape_interval:     5s
  evaluation_interval: 15s
  external_labels:
    cluster: velocity-local
    environment: development

scrape_configs:
  # ---- Our services -----------------------------------------------------
  - job_name: api-gateway
    static_configs:
      - targets: [api-gateway:9091]
        labels: { service: api-gateway, tier: control-plane }

  - job_name: submission-engine
    static_configs:
      - targets: [submission-engine:9092]
        labels: { service: submission-engine, tier: control-plane }

  - job_name: bot-controller
    static_configs:
      - targets: [bot-controller:9093]
        labels: { service: bot-controller, tier: load-gen }

  - job_name: bot-worker
    dns_sd_configs:
      - names: [bot-worker]
        type: A
        port: 9094
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance
    static_configs:
      - targets: []
        labels: { service: bot-worker, tier: load-gen }

  - job_name: telemetry-ingester
    static_configs:
      - targets: [telemetry-ingester:9095]
        labels: { service: telemetry-ingester, tier: data-plane }

  - job_name: correctness-validator
    static_configs:
      - targets: [correctness-validator:9096]
        labels: { service: correctness-validator, tier: data-plane }

  - job_name: leaderboard-ws
    static_configs:
      - targets: [leaderboard-ws:9097]
        labels: { service: leaderboard-ws, tier: data-plane }

  # ---- Infrastructure ---------------------------------------------------
  - job_name: redpanda
    static_configs:
      - targets: [redpanda:9644]
        labels: { service: redpanda, tier: infra }
    metrics_path: /metrics

  - job_name: questdb
    static_configs:
      - targets: [questdb:9003]
        labels: { service: questdb, tier: infra }

  # ---- Self ------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: { service: prometheus, tier: obs }
