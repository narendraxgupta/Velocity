# =============================================================================
# Prometheus — scrape configuration for the local dev stack.
#
# We use static targets here. In Kubernetes we replace this with the
# ServiceMonitor CRD via the Prometheus Operator.
# =============================================================================

global:
  scrape_interval:     5s
  evaluation_interval: 15s
  external_labels:
    cluster: velocity-local
    environment: development

scrape_configs:
  # ---- Our services -----------------------------------------------------
  #
  # Only services that actually expose a Prometheus /metrics endpoint are
  # scraped. leaderboard-ws serves /metrics on its WebSocket port (8090) and
  # audit-log on its HTTP port. The remaining C++ services (api-gateway,
  # submission-engine, bot-controller, bot-worker, telemetry-ingester,
  # correctness-validator) do not yet bind a /metrics exposer, so scraping
  # their nominal 909x ports only produced a wall of DOWN targets. They are
  # intentionally omitted until the in-process exposer is wired in; add the
  # jobs back here when it lands.
  - job_name: leaderboard-ws
    static_configs:
      - targets: [leaderboard-ws:8090]
        labels: { service: leaderboard-ws, tier: data-plane }
    metrics_path: /metrics

  - job_name: audit-log
    static_configs:
      - targets: [audit-log:8081]
        labels: { service: audit-log, tier: data-plane }
    metrics_path: /metrics

  # ---- Infrastructure ---------------------------------------------------
  - job_name: redpanda
    static_configs:
      - targets: [redpanda:9644]
        labels: { service: redpanda, tier: infra }
    metrics_path: /metrics

  # QuestDB exposes Prometheus metrics on its HTTP port (9000) at /metrics,
  # not on 9003 (which nothing binds).
  - job_name: questdb
    static_configs:
      - targets: [questdb:9000]
        labels: { service: questdb, tier: infra }
    metrics_path: /metrics

  # ---- Self ------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: { service: prometheus, tier: obs }
