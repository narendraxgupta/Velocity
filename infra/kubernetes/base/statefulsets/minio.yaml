apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: velocity-data
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: api,     port: 9000 }
    - { name: console, port: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: velocity-data
  labels: { app.kubernetes.io/name: minio }
spec:
  serviceName: minio
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: minio } }
  template:
    metadata: { labels: { app.kubernetes.io/name: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER,     valueFrom: { secretKeyRef: { name: minio-creds, key: access-key } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: minio-creds, key: secret-key } } }
          ports:
            - { name: api,     containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 2,    memory: 4Gi  }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 200Gi } }
