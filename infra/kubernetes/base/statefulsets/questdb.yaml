apiVersion: v1
kind: Service
metadata:
  name: questdb
  namespace: velocity-data
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: questdb }
  ports:
    - { name: pg,   port: 8812 }
    - { name: ilp,  port: 9009, protocol: TCP }
    - { name: http, port: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: questdb
  namespace: velocity-data
  labels: { app.kubernetes.io/name: questdb }
spec:
  serviceName: questdb
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: questdb } }
  template:
    metadata: { labels: { app.kubernetes.io/name: questdb } }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: questdb
          image: questdb/questdb:8.1.1
          ports:
            - { name: pg,   containerPort: 8812 }
            - { name: ilp,  containerPort: 9009, protocol: TCP }
            - { name: http, containerPort: 9000 }
          env:
            - { name: QDB_PG_USER,     value: "admin" }
            - { name: QDB_PG_PASSWORD, valueFrom: { secretKeyRef: { name: questdb-creds, key: pg-password, optional: true } } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/questdb }
          resources:
            requests: { cpu: 1, memory: 2Gi }
            limits:   { cpu: 4, memory: 8Gi }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 100Gi } }
