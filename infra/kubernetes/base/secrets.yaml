# =============================================================================
#  Shared secrets. These are PLACEHOLDERS. In production, supply via:
#    * AWS Secrets Manager + External Secrets Operator
#    * SOPS-encrypted overlays
#    * Vault Agent injector
#  Never commit real values into the cluster.
# =============================================================================

# minio-creds is consumed by api-gateway and submission-engine (control plane).
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: velocity-control
type: Opaque
stringData:
  access-key: "velocity-dev"
  secret-key: "velocity-dev-secret"
---
# Same secret needs to exist in the data-plane namespace so the MinIO
# StatefulSet can mount it as MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: velocity-data
type: Opaque
stringData:
  access-key: "velocity-dev"
  secret-key: "velocity-dev-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: questdb-creds
  namespace: velocity-data
type: Opaque
stringData:
  pg-password: "velocity-dev"
