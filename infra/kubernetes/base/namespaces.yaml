# =============================================================================
#  Velocity — Namespace layout
#
#  We isolate each tier in its own namespace so that NetworkPolicies and
#  ResourceQuotas have a clean boundary.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: velocity-control
  labels:
    app.kubernetes.io/part-of: velocity
    velocity.tier: control
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit:    restricted
    pod-security.kubernetes.io/warn:     restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: velocity-load
  labels:
    app.kubernetes.io/part-of: velocity
    velocity.tier: load-gen
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: velocity-data
  labels:
    app.kubernetes.io/part-of: velocity
    velocity.tier: data-plane
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: velocity-infra
  labels:
    app.kubernetes.io/part-of: velocity
    velocity.tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: velocity-sandbox
  labels:
    app.kubernetes.io/part-of: velocity
    velocity.tier: sandbox
    # The sandbox tier hosts UNTRUSTED submission code. Strictest possible
    # Pod Security Standards.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit:    restricted
    pod-security.kubernetes.io/warn:     restricted
