apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-service
  namespace: velocity-control
  labels: { app.kubernetes.io/name: scoring-service }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app.kubernetes.io/name: scoring-service } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: scoring-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9096"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scoring
          image: velocity/scoring-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: metrics, containerPort: 9096 }]
          env:
            - { name: VELOCITY_KAFKA_BROKERS,        value: "redpanda.velocity-data.svc.cluster.local:9092" }
            - { name: VELOCITY_GROUP_ID,             value: "velocity-scoring" }
            - { name: VELOCITY_LATENCY_TOPIC,        value: "metrics.latency.1s" }
            - { name: VELOCITY_CORRECTNESS_TOPIC,    value: "telemetry.fills" }
            - { name: VELOCITY_REDIS_ADDR,           value: "tcp://redis.velocity-data.svc.cluster.local:6379" }
            - { name: VELOCITY_LEADERBOARD_CHANNEL,  value: "leaderboard.global" }
            - { name: VELOCITY_LEADERBOARD_ZSET,     value: "leaderboard:composite" }
            - { name: VELOCITY_FLUSH_INTERVAL_MS,    value: "500" }
            - { name: VELOCITY_BASELINE_LATENCY_NS,  value: "30000" }
            - { name: VELOCITY_DEFAULT_TARGET_RPS,   value: "50000" }
          readinessProbe: { tcpSocket: { port: metrics }, periodSeconds: 5 }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi  }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities: { drop: ["ALL"] }
