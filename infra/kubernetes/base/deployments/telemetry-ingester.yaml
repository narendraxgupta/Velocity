apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingester
  namespace: velocity-control
  labels: { app.kubernetes.io/name: telemetry-ingester }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app.kubernetes.io/name: telemetry-ingester } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: telemetry-ingester }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9095"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ingester
          image: velocity/telemetry-ingester:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: metrics, containerPort: 9095 }]
          env:
            - { name: VELOCITY_REDPANDA_BROKERS,  value: "redpanda.velocity-data.svc.cluster.local:9092" }
            - { name: VELOCITY_KAFKA_GROUP_ID,    value: "velocity-ingester" }
            - { name: VELOCITY_TELEMETRY_TOPIC,   value: "telemetry.raw" }
            - { name: VELOCITY_LATENCY_TOPIC,     value: "metrics.latency.1s" }
            - { name: VELOCITY_QUESTDB_HOST,      value: "questdb.velocity-data.svc.cluster.local" }
            - { name: VELOCITY_QUESTDB_ILP_PORT,  value: "9009" }
            - { name: VELOCITY_REDIS_ADDR,        value: "redis.velocity-data.svc.cluster.local:6379" }
            - { name: VELOCITY_METRICS_PORT,      value: "9095" }
            - { name: VELOCITY_FLUSH_INTERVAL_MS, value: "250" }
          readinessProbe: { tcpSocket: { port: metrics }, periodSeconds: 5 }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: 2,    memory: 2Gi  }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities: { drop: ["ALL"] }
