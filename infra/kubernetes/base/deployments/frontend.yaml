apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: velocity-control
  labels: { app.kubernetes.io/name: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: frontend } }
  template:
    metadata: { labels: { app.kubernetes.io/name: frontend } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: velocity/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: NEXT_PUBLIC_API_BASE,       value: "/api" }
            - { name: NEXT_PUBLIC_LEADERBOARD_WS, value: "wss://velocity.example.com/ws" }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js writes to .next/cache at runtime; keep RW root for now.
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: velocity-control }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
