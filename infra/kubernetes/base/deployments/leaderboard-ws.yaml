apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard-ws
  namespace: velocity-control
  labels: { app.kubernetes.io/name: leaderboard-ws }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app.kubernetes.io/name: leaderboard-ws } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: leaderboard-ws }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9097"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: leaderboard
          image: velocity/leaderboard-ws:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: ws,      containerPort: 8090 }
            - { name: metrics, containerPort: 9097 }
          env:
            - { name: VELOCITY_WS_HOST,                value: "0.0.0.0" }
            - { name: VELOCITY_WS_PORT,                value: "8090" }
            - { name: VELOCITY_METRICS_PORT,           value: "9097" }
            - { name: VELOCITY_REDIS_ADDR,             value: "tcp://redis.velocity-data.svc.cluster.local:6379" }
            - { name: VELOCITY_REDIS_CHANNEL_PATTERN,  value: "leaderboard.*" }
          readinessProbe:
            httpGet: { path: /healthz, port: ws }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: ws }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi  }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata: { name: leaderboard-ws, namespace: velocity-control }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: leaderboard-ws }
  ports:
    - { name: ws,      port: 80,   targetPort: ws }
    - { name: metrics, port: 9097, targetPort: metrics }
