apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Each base manifest already pins itself to the correct namespace
# (velocity-control / velocity-load / velocity-data / velocity-sandbox), so we
# deliberately do NOT set a global `namespace:` here.

resources:
  - ../../base

# Phase 2: production replica counts, resource limits, ingress, TLS.
patches: []

commonAnnotations:
  velocity.io/cluster: prod
  velocity.io/environment: eks-us-east-1
